<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ניסוח">
<meta name="theme-color" content="#F2F0F7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>ניסוח: אימון כתיבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a training-log feel. Big condensed numerals mark each drill, one working column per drill. */
:root{
  --bg:#F2F0F7; --surface:#FFFFFF; --ink:#1D1A33; --muted:#666283; --line:#DBD7E8;
  --accent:#F04E42; --accent-ink:#FFFFFF; --second:#0B8F8F; --tint:#E7F5F4;
  --good:#17895B; --good-bg:#E3F5EC; --warn:#A86500; --warn-bg:#FFF1D6; --bad:#C2352B; --bad-bg:#FDE6E3;
  --display:"Karantina","Arial Narrow",sans-serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15132A; --surface:#201D3B; --ink:#F1EEFF; --muted:#A5A1C4; --line:#37335C;
    --accent:#FF7568; --accent-ink:#1B0B09; --second:#45CFCB; --tint:#1B3440;
    --good:#5BD6A0; --good-bg:#17382E; --warn:#F3BC5A; --warn-bg:#3D3016; --bad:#FF8E84; --bad-bg:#43201F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15132A; --surface:#201D3B; --ink:#F1EEFF; --muted:#A5A1C4; --line:#37335C;
  --accent:#FF7568; --accent-ink:#1B0B09; --second:#45CFCB; --tint:#1B3440;
  --good:#5BD6A0; --good-bg:#17382E; --warn:#F3BC5A; --warn-bg:#3D3016; --bad:#FF8E84; --bad-bg:#43201F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:28px 18px 56px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--second);outline-offset:2px}

/* home */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{font-family:var(--display);font-weight:700;font-size:84px;line-height:.8;letter-spacing:.01em}
.brand span{color:var(--accent)}
.tagline{color:var(--muted);margin:10px 0 0}
.today{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:var(--second)}
.lvl-name{font-family:var(--display);font-size:34px;line-height:.9}
.coach{display:flex;align-items:flex-end;gap:10px;max-width:400px}
.av{flex:0 0 52px;width:52px;height:52px;display:block}
.av svg{display:block;width:100%;height:100%}
.coach .av{flex-basis:88px;width:88px;height:88px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:17px;line-height:1.4}
.bubble b{display:block;color:var(--second);font-size:14px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,12,35,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.lvl-card{background:var(--surface);border-radius:20px;padding:26px 30px;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.lvl-card .av{flex:none;width:120px;height:120px;animation:hop .6s ease-in-out 3}
.lvl-card p{margin:0 0 8px}
.lvl-num{font-family:var(--display);font-weight:700;font-size:76px;line-height:.85;color:var(--accent)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.today-row{display:flex;justify-content:space-between;gap:16px;font-weight:600}
.today-row small{color:var(--muted);font-weight:400;font-size:15px}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.segs i{height:8px;border-radius:4px;background:var(--line)}
.segs i.on{background:var(--accent)}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.drill{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:transform .12s,border-color .12s}
.drill:hover{transform:translateY(-2px);border-color:var(--accent)}
.drill .num{font-family:var(--display);font-size:64px;line-height:.85;color:var(--accent);grid-row:span 3;min-width:34px}
.drill{position:relative}
.drill.done{border-color:var(--good);background:var(--good-bg)}
.drill.done .num{color:var(--good)}
.tick{position:absolute;right:14px;bottom:12px;width:30px;height:30px;border-radius:50%;background:var(--good);color:var(--surface);display:flex;align-items:center;justify-content:center}
.tick svg{width:18px;height:18px}
.drill h3{font-size:21px;line-height:1.25}
.drill p{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:14px;border-radius:99px;padding:1px 10px;background:var(--tint);color:var(--second);font-weight:600}
.pill.ok{background:var(--good-bg);color:var(--good)}
.note{color:var(--muted);font-size:15px;border-top:1px solid var(--line);padding-top:14px;margin:0}

/* drill view */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600}
.back:hover{color:var(--ink)}
.head{display:flex;gap:16px;align-items:flex-end}
.head .num{font-family:var(--display);font-size:92px;line-height:.78;color:var(--accent)}
.head h2{font-size:30px;line-height:1.15}
.head p{margin:4px 0 0;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px}
.label{font-size:15px;font-weight:700;color:var(--second)}
.prompt{font-size:26px;font-weight:700;line-height:1.35;margin:0}
.prompt .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);margin:0 4px}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:22px;font-weight:600}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--second);outline:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 16px;font-weight:600}
.chip[aria-pressed=true]{background:var(--second);border-color:var(--second);color:var(--surface)}
.btn{border:0;border-radius:10px;padding:10px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stem{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.stem b{font-family:var(--display);font-size:34px;line-height:1;color:var(--accent);min-width:54px}
.fb{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.fb .tx{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.parts{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-top:4px}
.part{background:var(--surface);border-radius:10px;padding:8px 12px;line-height:1.35}
.part small{display:block;font-size:14px;font-weight:700;color:var(--second)}
.link{align-self:center;font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--accent);white-space:nowrap}
.sample{border:2px dashed var(--second);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--tint)}
.sample-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:16px;color:var(--muted)}
.sample-row{display:flex;gap:10px;align-items:baseline}
.sample-row .n{font-family:var(--display);font-size:30px;line-height:1;color:var(--second);min-width:16px}
.sample-row small{display:block;font-size:14px;font-weight:700;color:var(--second)}
.btn.wait:disabled{background:var(--line);color:var(--muted);opacity:1}
.clock{font-variant-numeric:tabular-nums}
@media (max-width:480px){.parts{grid-template-columns:1fr}.link{justify-self:center}}
.fb.good .av{animation:hop .5s ease-in-out 2}
.fb.good{background:var(--good-bg)} .fb.warn{background:var(--warn-bg)} .fb.bad{background:var(--bad-bg)}
.fb.good strong{color:var(--good)} .fb.warn strong{color:var(--warn)} .fb.bad strong{color:var(--bad)}
.fb p{margin:0}
.example{border-inline-start:4px solid var(--second);padding:4px 14px;background:var(--tint);border-radius:0 8px 8px 0}
[dir=rtl] .example{border-radius:8px 0 0 8px}
.example small{display:block;color:var(--second);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-weight:700;font-size:20px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:8px;min-height:52px}
.sent{text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:baseline}
.sent:hover:not(:disabled){border-color:var(--accent)}
.sent .n{font-family:var(--display);font-size:28px;line-height:1;color:var(--accent);min-width:18px}
.sent .role{margin-inline-start:auto;white-space:nowrap}
.sent.right{border-color:var(--good)} .sent.wrong{border-color:var(--bad);background:var(--bad-bg)}
.empty{color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;padding:10px 14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field label small{font-weight:400;color:var(--muted)}
.result{font-size:20px;line-height:1.7;margin:0}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:baseline}
.checks input{width:18px;height:18px;accent-color:var(--second)}
.count{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.brand{font-size:68px}.prompt{font-size:22px}.head .num{font-size:72px}.sheet{padding:16px}}
@media (prefers-reduced-motion:reduce){.drill{transition:none}.lvl-card,.lvl-card .av,.fb.good .av{animation:none}}
.who{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:10px 0 0;color:var(--muted);font-size:16px}
.who span{font-weight:700;color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--second);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lvl-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lvl-opt{text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.lvl-opt:hover{border-color:var(--accent)}
.lvl-opt b{font-family:var(--display);font-size:40px;line-height:.85;color:var(--accent)}
.lvl-opt span{color:var(--muted);font-size:16px;line-height:1.4}
.lvl-opt[aria-pressed=true]{border-color:var(--second);background:var(--tint)}
.users{display:flex;flex-wrap:wrap;gap:10px}
.err{color:var(--bad);font-weight:600;margin:0;min-height:1em}
.id{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em;direction:ltr}
</style>
</head>
<body>
<main id="app"></main>
<script src="exercises.js"></script>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var BANK=window.NISUACH_BANK;

var DRILLS=[
 {id:"expand",title:"משפט מתרחב",desc:"לוקחים משפט קצר ומוסיפים לו פרטים.",mins:2,
  why:"משפט טוב עונה על שאלות. כל שאלה שעונים עליה מוסיפה לקורא תמונה ברורה יותר."},
 {id:"because",title:"כי, אבל, לכן",desc:"אותה התחלה, שלושה המשכים שונים.",mins:3,
  why:"שלוש המילים האלה מכריחות לחשוב על סיבה, על צד שני ועל תוצאה. זה הבסיס של כל תשובה מנומקת."},
 {id:"combine",title:"מחברים משפטים",desc:"כמה משפטים קצרים הופכים למשפט אחד.",mins:3,
  why:"משפטים קצרים ונפרדים נשמעים קטועים. חיבור שלהם מראה איך הרעיונות קשורים זה לזה."},
 {id:"connectors",title:"מילת הקישור",desc:"עד חמש שאלות מהירות. איזו מילה מתאימה?",mins:2,
  why:"מילת קישור אומרת לקורא מה היחס בין שני רעיונות: ניגוד, תוצאה, דוגמה, הסבר או תוספת."},
 {id:"order",title:"סדר בפסקה",desc:"משפטים מבולגנים. מה בא קודם?",mins:3,
  why:"פסקה טובה בנויה בסדר קבוע. כשמכירים את הסדר, קל יותר לכתוב אותו."},
 {id:"paragraph",title:"פסקה משלך",desc:"בונים פסקה שלב אחר שלב, על נושא לבחירה.",mins:6,
  why:"במקום דף ריק יש כמה שלבים קטנים. בסוף מחברים אותם ומקבלים פסקה שלמה."}
];
var LEVELS=[null,
 {name:"יסודות",desc:"משפטים קצרים, מילות קישור בסיסיות ופסקה בשלושה שלבים."},
 {name:"בנייה",desc:"דעה ונימוק, ניגוד והשוואה, ופסקה עם דוגמה וצד שני."},
 {name:"שליטה",desc:"לשון רשמית, משפטים מורכבים ופסקה עם טענת נגד."}];
var MAXL=3,ROUNDS=2,LOCK=3;

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function words(s){return String(s).trim().split(/\s+/).filter(Boolean);}
function $(sel){return app.querySelector(sel);}
function $$(sel){return Array.prototype.slice.call(app.querySelectorAll(sel));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dayKey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

if(!BANK){
  app.innerHTML='<div class="sheet"><h2>קובץ התרגילים חסר</h2><p>הקובץ exercises.js צריך להיות באותה תיקייה כמו הקובץ הזה, עם השם הזה בדיוק.</p></div>';
  return;
}
var BYID={};
DRILLS.forEach(function(d){(BANK[d.id]||[]).forEach(function(it){it.drill=d.id;BYID[it.id]=it;});});

/* ---------- storage: one record per user, progress kept by exercise ID ---------- */
var KEY="nisuach-v2";
var db={users:{},current:null};
try{var raw=localStorage.getItem(KEY);if(raw){var parsed=JSON.parse(raw);if(parsed&&parsed.users)db=parsed;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
function me(){return db.current&&db.users[db.current]||null;}
function addUser(name,level){
  var id="u"+Date.now().toString(36)+Math.floor(Math.random()*1000);
  db.users[id]={name:name,level:level,done:{},days:{},counts:{},cur:{},total:0};
  db.current=id;save();
}
function cnt(u,L,drill){return (u.counts[L]&&u.counts[L][drill])||0;}
function fresh(drill,L){var u=me();return (BANK[drill]||[]).filter(function(it){return it.level===L&&!u.done[it.id];});}
function poolSize(drill,L){return (BANK[drill]||[]).filter(function(it){return it.level===L;}).length;}
/* the exercise in progress stays the same until it is finished; a finished one never comes back */
function pick(drill){
  var u=me(),L=u.level,c=BYID[u.cur[drill]];
  if(c&&c.level===L&&!u.done[c.id])return c;
  var f=fresh(drill,L);if(!f.length)return null;
  var it=f[Math.floor(Math.random()*f.length)];u.cur[drill]=it.id;save();return it;
}
function finishItem(id){var u=me(),it=BYID[id];u.done[id]=dayKey(new Date());if(it&&u.cur[it.drill]===id)delete u.cur[it.drill];save();}
function doneToday(){var u=me();return u.days[dayKey(new Date())]||[];}
function streak(){var u=me(),d=new Date(),n=0;if(!(u.days[dayKey(d)]||[]).length)d.setDate(d.getDate()-1);
  while((u.days[dayKey(d)]||[]).length){n++;d.setDate(d.getDate()-1);}return n;}
function levelInfo(){
  var u=me(),L=u.level,need=ROUNDS*DRILLS.length,left=0;
  DRILLS.forEach(function(d){left+=Math.max(0,ROUNDS-cnt(u,L,d.id));});
  return{n:L,name:LEVELS[L].name,max:L===MAXL,left:left,pct:Math.round((need-left)/need*100)};
}
function setLevel(L){var u=me();u.level=L;u.cur={};save();}

/* ---------- אודיה ---------- */
function avatar(mood){
  var eyes=mood==="happy"?'<path d="M45 58q5-7 10 0M65 58q5-7 10 0" fill="none" stroke="#1D1A33" stroke-width="3" stroke-linecap="round"/>':
    '<circle cx="50" cy="56" r="3.2" fill="#1D1A33"/><circle cx="70" cy="56" r="3.2" fill="#1D1A33"/>'+(mood==="think"?'<path d="M64 47l11-3" stroke="#2B2140" stroke-width="3" stroke-linecap="round"/>':'');
  var mouth=mood==="happy"?'<path d="M51 66q9 12 18 0z" fill="#8A2F3A"/>':
    mood==="think"?'<path d="M54 70l12-2" stroke="#8A2F3A" stroke-width="3" stroke-linecap="round"/>':
    '<path d="M53 67q7 6 14 0" fill="none" stroke="#8A2F3A" stroke-width="3" stroke-linecap="round"/>';
  return '<span class="av"><svg viewBox="0 0 120 120" role="img" aria-label="אודיה">'+
    '<path d="M28 56Q28 22 60 22Q92 22 92 56L92 90Q92 96 86 96L34 96Q28 96 28 90Z" fill="#2B2140"/>'+
    '<path d="M14 120Q16 90 60 88Q104 90 106 120Z" fill="var(--second)"/>'+
    '<rect x="52" y="74" width="16" height="18" fill="#E5B48C"/>'+
    '<ellipse cx="60" cy="54" rx="24" ry="26" fill="#F2C6A0"/>'+
    '<path d="M36 52Q38 28 60 27Q82 28 84 52Q74 38 58 40Q44 41 36 52Z" fill="#2B2140"/>'+
    '<path d="M70 30Q80 34 83 48Q76 38 68 37Z" fill="var(--accent)"/>'+
    '<path d="M24 56Q24 12 60 12Q96 12 96 56" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>'+
    '<rect x="17" y="46" width="13" height="24" rx="6" fill="var(--accent)"/><rect x="90" y="46" width="13" height="24" rx="6" fill="var(--accent)"/>'+
    '<circle cx="43" cy="64" r="4" fill="#F08C8C" opacity=".45"/><circle cx="77" cy="64" r="4" fill="#F08C8C" opacity=".45"/>'+
    eyes+mouth+'</svg></span>';
}

/* ---------- celebrations ---------- */
var cv=null,run=0;
function confetti(n){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  if(!cv){cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);}
  var ctx=cv.getContext("2d"),W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
  var cols=["#F04E42","#0B8F8F","#F3BC5A","#7C5CFF","#45CFCB","#FF9DB0"],ps=[],i,mine=++run,t0=performance.now(),life=2600;
  for(i=0;i<n;i++)ps.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,s:6+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  function frame(t){
    if(mine!==run)return;
    var el=t-t0;ctx.clearRect(0,0,W,H);
    if(el>=life)return;
    ctx.globalAlpha=Math.max(0,1-el/life);
    ps.forEach(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function levelUp(L){
  var o=document.createElement("div");o.className="overlay";
  o.innerHTML='<div class="lvl-card" role="dialog" aria-modal="true" aria-label="עלייה ברמה">'+avatar("happy")+
    '<div class="label">כל הכבוד!</div><div class="lvl-num">רמה '+L+'</div><p>עלייה לשלב "'+LEVELS[L].name+'". מעכשיו: '+LEVELS[L].desc+'</p>'+
    '<button class="btn" type="button">ממשיכים</button></div>';
  document.body.appendChild(o);
  var b=o.querySelector("button");b.onclick=function(){o.remove();};b.focus();
  confetti(240);
}
/* one credit per finished exercise */
var credited=false;
function credit(drill,win){
  if(credited)return;credited=true;
  var u=me(),L=u.level,k=dayKey(new Date());
  u.counts[L]=u.counts[L]||{};u.counts[L][drill]=cnt(u,L,drill)+1;u.total++;
  var a=u.days[k]||[];if(a.indexOf(drill)<0)a.push(drill);u.days[k]=a;
  var up=L<MAXL&&DRILLS.every(function(d){return cnt(u,L,d.id)>=ROUNDS;});
  if(up)setLevel(L+1);else save();
  if(up)levelUp(L+1);else if(win)confetti(90);
}

/* ---------- shared pieces ---------- */
function fbRaw(kind,title,html){return '<div class="fb '+kind+'">'+avatar(kind==="good"?"happy":"think")+'<div class="tx"><strong>'+esc(title)+'</strong>'+html+'</div></div>';}
function fb(kind,title,text){return fbRaw(kind,title,text?'<p>'+esc(text)+'</p>':'');}
function example(text,label){return '<div class="example"><small>'+esc(label||"דוגמה אחת מתוך הרבה אפשריות")+'</small>'+esc(text)+'</div>';}
function endButtons(){return '<div class="row"><button class="btn" id="again" type="button">עוד אחד</button><button class="btn ghost" id="home" type="button">חזרה לרשימה</button></div>';}
function wireEnd(){$("#again").onclick=function(){render();};$("#home").onclick=function(){go("home");};}
function shell(d,inner,itemId){
  var n=DRILLS.indexOf(d)+1,u=me();
  app.innerHTML='<div class="bar"><button class="back" type="button" id="back">→ חזרה לרשימה</button>'+
    '<span class="row"><span class="pill">רמה '+u.level+'</span><span class="pill">'+d.mins+' דקות</span>'+(itemId?'<span class="id">'+esc(itemId)+'</span>':'')+'</span></div>'+

}
function exhausted(d){
  var u=me(),L=u.level;
  shell(d,fb("good","כל הכבוד! כל תרגילי \""+d.title+"\" ברמה "+L+" הושלמו",
      L<MAXL?"אפשר לעבור לרמה "+(L+1)+", או לתרגל שוב את התרגילים של הרמה הזו.":"אפשר לתרגל שוב את התרגילים של הרמה הזו.")+
    '<div class="row">'+(L<MAXL?'<button class="btn" id="up" type="button">מעבר לרמה '+(L+1)+'</button>':'')+
    '<button class="btn ghost" id="redo" type="button">תרגול חוזר</button><button class="btn ghost" id="home" type="button">חזרה לרשימה</button></div>');

/* ---------- drills ---------- */
function expand(d){
  var it=pick(d.id);if(!it)return exhausted(d);
  shell(d,'<div><div class="label">המשפט הקצר</div><p class="prompt">'+esc(it.base)+'</p></div>'+
    '<div class="field"><label for="ans">כותבים אותו מחדש, עם יותר פרטים</label><textarea id="ans" rows="3" placeholder="'+esc(it.base.replace(".",""))+'..."></textarea></div>'+
    '<div><div class="label">מסמנים כל שאלה שהמשפט החדש עונה עליה</div><div class="row" style="margin-top:8px">'+
    it.qs.map(function(q){return '<button class="chip" type="button" aria-pressed="false">'+esc(q)+'</button>';}).join("")+'</div></div>'+
    '<div class="row"><button class="btn" id="check" type="button">בדיקה</button></div>',it.id);
  $$(".chip").forEach(function(c){c.onclick=function(){c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")==="true"?"false":"true");};});
  $("#check").onclick=function(){
    var n=words($("#ans").value).length,base=words(it.base).length,q=$$('.chip[aria-pressed="true"]').length,h;
    if(!n){$("#out").innerHTML=fb("warn","עוד אין כאן משפט","כותבים משפט בתיבה ולוחצים שוב על בדיקה.");return;}
    if(n<base+3){$("#out").innerHTML=fb("warn","צריך עוד כמה מילים","המשפט החדש צריך להיות ארוך לפחות בשלוש מילים מהמשפט הקצר. אפשר לענות על עוד שאלה מהרשימה.");return;}
    if(q<2)h=fb("warn","המשפט גדל מ־"+base+" ל־"+n+" מילים","סומנו פחות משתי שאלות. אפשר לבדוק אם יש מקום לעוד פרט.");
    else h=fb("good","כל הכבוד! המשפט גדל מ־"+base+" ל־"+n+" מילים","המשפט עונה על "+q+" שאלות. כדאי לקרוא אותו בקול ולבדוק שהוא נשמע טבעי.");
    finishItem(it.id);
    $("#out").innerHTML=h+example(it.ex)+endButtons();wireEnd();credit(d.id,h.indexOf("fb good")>=0);
  };
}

function because(d){
  var it=pick(d.id);if(!it)return exhausted(d);
  var keys=["כי","אבל","לכן"];
  shell(d,'<div><div class="label">ההתחלה</div><p class="prompt">'+esc(it.stem)+'...</p></div>'+
    keys.map(function(k,i){return '<div class="stem"><b>'+k+'</b><input type="text" id="s'+i+'" aria-label="המשך אחרי '+k+'" placeholder="ממשיכים את המשפט"></div>';}).join("")+
    '<div class="row"><button class="btn" id="check" type="button">בדיקה</button></div>',it.id);
  $("#check").onclick=function(){
    var empty=0,short=[];
    keys.forEach(function(k,i){var n=words($("#s"+i).value).length;if(!n)empty++;else if(n<3)short.push(k);});
    if(empty){$("#out").innerHTML=fb("warn","צריך להשלים את כל שלושת ההמשכים","נשארו "+empty+" המשכים ריקים.");return;}
    if(short.length){$("#out").innerHTML=fb("warn","ההמשך אחרי \""+short.join("\" ואחרי \"")+"\" קצר מדי","בכל המשך צריכות להיות לפחות שלוש מילים שמסבירות את הכוונה.");return;}
    finishItem(it.id);
    $("#out").innerHTML=fb("good","כל הכבוד! שלושה המשכים מלאים","כדאי לבדוק: ״כי״ נותן סיבה, ״אבל״ מציג צד שני, ״לכן״ מציג תוצאה.")+
      example(it.ex.map(function(e){return it.stem+" "+e;}).join(" "),"דוגמאות להמשך")+endButtons();
    wireEnd();credit(d.id,true);
  };
}

var CONN=["כי","אבל","לכן","בגלל","למרות","כאשר","מפני","משום","כיוון","מכיוון","אך","אז","כדי","אחרי","לפני","עד","אף","ואילו","מאחר","אולם","אלא","כך","שכן","לפיכך","בכל","גם","אחר"];
function combine(d){
  var it=pick(d.id);if(!it)return exhausted(d);
  var partsWords=words(it.parts.join(" ")).length,need=Math.max(5,Math.ceil(partsWords*0.55));
  shell(d,'<div><div class="label">המשפטים הקצרים</div><ul class="lines">'+it.parts.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+'</ul></div>'+
    '<div class="field"><label for="ans">מחברים אותם למשפט אחד <small>אפשר לשנות מילים ולהחליף סדר</small></label><textarea id="ans" rows="3"></textarea></div>'+
    '<div class="row"><button class="btn" id="check" type="button">בדיקה</button></div>',it.id);
  $("#check").onclick=function(){
    var t=$("#ans").value.trim();
    if(!t){$("#out").innerHTML=fb("warn","עוד אין כאן משפט","כותבים משפט בתיבה ולוחצים שוב על בדיקה.");return;}
    var ends=(t.replace(/[.!?]+\s*$/,"").match(/[.!?]/g)||[]).length;
    if(ends>0){$("#out").innerHTML=fb("warn","יש כאן יותר ממשפט אחד","יש נקודה באמצע. מחליפים אותה במילת קישור כמו כי, אבל או למרות.");return;}
    var toks=words(t.replace(/[.,!?;:"'״׳]/g," "));
    if(toks.length<need){$("#out").innerHTML=fb("warn","חסרים רעיונות","המשפט צריך לכלול את כל הרעיונות מהמשפטים הקצרים.");return;}
    var has=toks.some(function(w){var b=w.replace(/^ו/,"");return CONN.indexOf(w)>=0||CONN.indexOf(b)>=0||/^ו?כש./.test(w)||/^ו?ש(ה|ל|ב)/.test(w);});
    var h=has?fb("good","כל הכבוד! משפט אחד עם מילת קישור","כדאי לבדוק שכל הרעיונות נמצאים בו."):
      fb("warn","לא נמצאה מילת קישור מוכרת","ייתכן שיש כאן מילה שהבדיקה לא מכירה. כדאי להשוות לדוגמה.");
    finishItem(it.id);
    $("#out").innerHTML=h+example(it.ex)+endButtons();wireEnd();credit(d.id,has);
  };
}

function connectors(d){
  var u=me(),round=shuffle(fresh(d.id,u.level)).slice(0,5);
  if(!round.length)return exhausted(d);
  var i=0,score=0;
  function q(){
    var it=round[i],opts=shuffle(it.opts);
    shell(d,'<div class="row" style="justify-content:space-between"><span class="label">שאלה '+(i+1)+' מתוך '+round.length+'</span><span class="count">נכונות: '+score+'</span></div>'+
      '<p class="prompt">'+esc(it.a)+' <span class="gap">&nbsp;</span>'+(it.b.charAt(0)===","?"":" ")+esc(it.b)+'</p>'+
      '<div class="opts">'+opts.map(function(o){return '<button class="opt" type="button">'+esc(o)+'</button>';}).join("")+'</div>',it.id);
    $$(".opt").forEach(function(b){b.onclick=function(){
      var ok=b.textContent===it.right;if(ok){score++;finishItem(it.id);}
      $$(".opt").forEach(function(x){x.disabled=true;if(x.textContent===it.right)x.classList.add("right");});
      if(!ok)b.classList.add("wrong");
      var last=i===round.length-1;
      var clean=function(t){return t.replace(/^[,\s]+|[.,\s]+$/g,"");};
      var detail='<p>'+it.why+'</p><div class="parts"><div class="part"><small>'+esc(it.l[0])+'</small><b>'+esc(clean(it.a))+'</b></div>'+
        '<div class="link">'+esc(it.right)+'</div><div class="part"><small>'+esc(it.l[1])+'</small><b>'+esc(clean(it.b))+'</b></div></div>';
      var nextLabel=last?"לסיכום":"לשאלה הבאה",left=LOCK;
      $("#out").innerHTML=fbRaw(ok?"good":"bad",ok?"כל הכבוד, נכון":"התשובה הנכונה: \""+it.right+"\"",detail)+
        '<div class="row"><button class="btn wait" id="next" type="button" disabled>קוראים את ההסבר · <span class="clock">0:0'+LOCK+'</span></button></div>';
      var nb=$("#next");
      nb.onclick=function(){if(last)end();else{i++;q();}};
      var tick=setInterval(function(){
        if(!document.body.contains(nb)){clearInterval(tick);return;}
        left--;
        if(left>0){nb.querySelector(".clock").textContent="0:0"+left;}
        else{clearInterval(tick);nb.disabled=false;nb.classList.remove("wait");nb.textContent=nextLabel;nb.focus();}
      },1000);
    };});
  }
  function end(){
    var good=score>=Math.ceil(round.length*0.8);
    credit(d.id,good);
    shell(d,fb(good?"good":"warn",(good?"כל הכבוד! ":"")+score+" מתוך "+round.length+" נכונות",
      good?"זיהוי מצוין של הקשר בין הרעיונות.":"שאלות שהיו בהן טעויות יחזרו בסבב אחר. כדאי לשים לב אם החלק השני מנוגד, מוסיף, מדגים, מסביר או נובע מהראשון.")+
      '<div class="row"><button class="btn" id="again" type="button">סבב נוסף</button><button class="btn ghost" id="home" type="button">חזרה לרשימה</button></div>');
    $("#again").onclick=function(){render();};$("#home").onclick=function(){go("home");};
  }
  q();
}

function order(d){
  var it=pick(d.id);if(!it)return exhausted(d);
  var correct=it.s,pool=correct.map(function(_,i){return i;});
  do{pool=shuffle(pool);}while(pool.every(function(v,i){return v===i;}));
  var built=[],checked=false;
  function draw(){
    var left=pool.filter(function(i){return built.indexOf(i)<0;});
    var ok=checked&&built.every(function(v,i){return v===i;});
    shell(d,'<div><div class="label">משפטים מבולגנים: לוחצים עליהם לפי הסדר הנכון</div><div class="stack" style="margin-top:8px">'+
      (left.length?left.map(function(i){return '<button class="sent" type="button" data-add="'+i+'">'+esc(correct[i])+'</button>';}).join(""):'<div class="empty">כל המשפטים בפסקה.</div>')+'</div></div>'+
      '<div><div class="label">הפסקה: לחיצה על משפט מחזירה אותו למעלה</div><div class="stack" style="margin-top:8px">'+
      (built.length?built.map(function(i,pos){var cls=checked?(i===pos?" right":" wrong"):"";
        return '<button class="sent'+cls+'" type="button" data-rm="'+i+'"'+(ok?" disabled":"")+'><span class="n">'+(pos+1)+'</span><span>'+esc(correct[i])+'</span>'+(ok?'<span class="pill ok role">'+esc(it.roles[pos])+'</span>':'')+'</button>';}).join(""):'<div class="empty">עדיין ריק. איזה משפט פותח את הפסקה?</div>')+'</div></div>'+
      (ok?"":'<div class="row"><button class="btn" id="check" type="button"'+(built.length<correct.length?" disabled":"")+'>בדיקה</button></div>'),it.id);
    $$("[data-add]").forEach(function(b){b.onclick=function(){built.push(+b.getAttribute("data-add"));checked=false;draw();};});
    $$("[data-rm]").forEach(function(b){b.onclick=function(){built.splice(built.indexOf(+b.getAttribute("data-rm")),1);checked=false;draw();};});
    if(ok){finishItem(it.id);credit(d.id,true);
      $("#out").innerHTML=fb("good","כל הכבוד! הסדר נכון","כדאי לשים לב לתפקיד של כל משפט: "+it.roles.join(", ")+". זה השלד של תשובה מנומקת.")+endButtons();wireEnd();}
    else if(checked){$("#out").innerHTML=fb("bad","עוד לא","המשפטים המסומנים באדום לא במקום. רמז: הטענה פותחת, והמשפט שמסכם סוגר.");}
    var c=$("#check");if(c)c.onclick=function(){checked=true;draw();};
  }
  draw();
}

var STEPS={
 basic:[["הטענה","מה הדעה? משפט אחד ברור","לדעתי..."],["נימוק או דוגמה","מה מראה שזה נכון?","למשל..."],["הסבר","איך הנימוק מחזק את הטענה?","זה מראה ש..."]],
 full:[["הטענה","מה הדעה? משפט אחד ברור","לדעתי..."],["נימוק","למה זה נכון?","הסיבה היא ש..."],["צד שני","מה טוענים מי שחושבים אחרת, ומה התשובה להם?","אמנם..., אולם..."],["מסקנה","מה יוצא מכל זה?","לפיכך..."]]
};
function paragraph(d){
  var u=me(),L=u.level,f=fresh(d.id,L);
  if(!f.length)return exhausted(d);
  var keep=(u.cur.paragraph||[]).filter(function(id){var t=BYID[id];return t&&t.level===L&&!u.done[id];});
  if(keep.length<Math.min(3,f.length)){keep=shuffle(f).slice(0,3).map(function(t){return t.id;});u.cur.paragraph=keep;save();}
  var topics=keep.map(function(id){return BYID[id];}),topic=0,steps=L===3?STEPS.full:STEPS.basic,canHint=L<3;
  shell(d,'<div><div class="label">בוחרים שאלה</div><div class="row" style="margin-top:8px">'+
    topics.map(function(t,i){return '<button class="chip" type="button" data-t="'+i+'" aria-pressed="'+(i===0)+'">'+esc(t.topic)+'</button>';}).join("")+'</div></div>'+
    steps.map(function(s,i){return '<div class="field"><label for="p'+i+'">'+(i+1)+'. '+s[0]+' <small>'+s[1]+'</small></label><textarea id="p'+i+'" rows="2" placeholder="'+s[2]+'"></textarea></div>';}).join("")+
    '<div class="row"><button class="btn" id="check" type="button">חיבור לפסקה</button>'+
    (canHint?'<button class="btn ghost" id="hint" type="button" aria-expanded="false">להציג דוגמה</button>':'<span class="count">ברמה 3 כותבים בלי דוגמה.</span>')+'</div>'+
    '<div id="sample"></div>',topics[0].id);
  var open=false;
  function drawSample(){
    var box=$("#sample"),hb=$("#hint");
    if(!hb)return;
    hb.textContent=open?"להסתיר את הדוגמה":"להציג דוגמה";hb.setAttribute("aria-expanded",open?"true":"false");
    if(!open){box.innerHTML="";return;}
    box.innerHTML='<div class="sample"><div class="sample-head"><span class="pill">דוגמה בלבד</span><span>כך נראים השלבים כשהם מתחברים. הדעה והנימוקים בפסקה שלך יהיו אחרים.</span></div>'+
      '<div class="label">'+esc(topics[topic].topic)+'</div>'+
      topics[topic].sample.map(function(t,i){return '<div class="sample-row"><span class="n">'+(i+1)+'</span><div><small>'+steps[i][0]+'</small>'+esc(t)+'</div></div>';}).join("")+'</div>';
  }
  if(canHint)$("#hint").onclick=function(){open=!open;drawSample();};
  $$("[data-t]").forEach(function(b){b.onclick=function(){topic=+b.getAttribute("data-t");
    $$("[data-t]").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
    var idEl=app.querySelector(".bar .id");if(idEl)idEl.textContent=topics[topic].id;drawSample();};});
  $("#check").onclick=function(){
    var parts=steps.map(function(_,i){return $("#p"+i).value.trim();});
    var weak=[];parts.forEach(function(p,i){if(words(p).length<4)weak.push(i+1);});
    if(weak.length){$("#out").innerHTML=fb("warn","צריך עוד קצת בשלב "+weak.join(" ובשלב "),"בכל שלב צריך משפט של לפחות ארבע מילים.");return;}
    var text=parts.map(function(p){return /[.!?]$/.test(p)?p:p+".";}).join(" ");
    var n=words(text).length,target=L===3?45:30,good=n>=target,t=topics[topic];
    finishItem(t.id);u.cur.paragraph=[];save();credit(d.id,good);
    var checks=["מי שקורא רק את המשפט הראשון מבין מה הדעה שלי.","הנימוק מוחשי: יש בו דוגמה, מספר או מקרה.","ההסבר מחבר בין הנימוק לטענה ולא חוזר עליה."];
    if(L===3)checks=["מי שקורא רק את המשפט הראשון מבין מה הדעה שלי.","הנימוק מוחשי: יש בו דוגמה, מספר או מקרה.","הצד השני מוצג בהגינות, ויש לו תשובה.","המסקנה נובעת מהנימוק ולא רק חוזרת על הטענה."];
    $("#out").innerHTML=fb(good?"good":"warn",(good?"כל הכבוד! ":"")+"פסקה של "+n+" מילים",good?"כדאי לקרוא אותה בקול פעם אחת ולעבור על הבדיקה העצמית.":"היא קצרה יחסית. אפשר להוסיף פרט אחד לנימוק או להסבר.")+
      '<div><div class="label">'+esc(t.topic)+'</div><p class="result" id="res"></p></div>'+
      '<div class="checks"><div class="label">בדיקה עצמית</div>'+checks.map(function(c,i){return '<label><input type="checkbox" id="c'+i+'"><span>'+c+'</span></label>';}).join("")+'</div>'+
      '<div class="row"><button class="btn ghost" id="copy" type="button">העתקת הפסקה</button><button class="btn" id="again" type="button">עוד פסקה</button><button class="btn ghost" id="home" type="button">חזרה לרשימה</button></div>';
    $("#res").textContent=text;
    wireEnd();
    $("#copy").onclick=function(){var b=this;
      try{navigator.clipboard.writeText(text).then(function(){b.textContent="הועתק";},function(){b.textContent="ההעתקה נחסמה. אפשר לסמן את הטקסט ולהעתיק ידנית.";});}
      catch(e){b.textContent="ההעתקה נחסמה. אפשר לסמן את הטקסט ולהעתיק ידנית.";}};
  };
}

/* ---------- routing ---------- */
var VIEWS={expand:expand,because:because,combine:combine,connectors:connectors,order:order,paragraph:paragraph};
var current=location.hash.replace("#","")||"home";
function render(){
  credited=false;
  if(!me()||current==="start")start();
  else if(current==="level")levelScreen();
  else{var d=DRILLS.filter(function(x){return x.id===current;})[0];if(d)VIEWS[current](d);else home();}
  try{window.scrollTo(0,0);}catch(e){}
}
/* navigation works on its own; the address hash is only kept in step where the viewer allows it */
function go(id){
  current=id;render();
  try{if(location.hash.replace("#","")!==id)location.hash=id;}catch(e){}
}
window.addEventListener("hashchange",function(){
  var h=location.hash.replace("#","")||"home";
  if(h!==current){current=h;render();}
});
render();
})();
</script>
